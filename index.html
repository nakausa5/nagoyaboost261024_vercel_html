<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>弓矢ゲーム</title>
<style>
  :root{--bg:#87CEEB;--ground:#2e8b57;--hud-bg:rgba(0,0,0,0.45);}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","メイリオ",sans-serif;background:linear-gradient(#87CEEB,#bfe9ff);}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;}
  canvas{background:linear-gradient(#87CEEB,#bfe9ff);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.25);}
  .hud{position:fixed;left:12px;top:12px;background:var(--hud-bg);color:#fff;padding:10px;border-radius:8px;font-size:14px;}
  .hint{position:fixed;right:12px;top:12px;background:var(--hud-bg);color:#fff;padding:10px;border-radius:8px;font-size:13px;text-align:right;}
  .centerMsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.6);color:#fff;padding:14px 18px;border-radius:10px;display:none;}
  button{margin-top:8px;padding:6px 10px;border-radius:6px;border:none;background:#ff9800;color:#fff;cursor:pointer;}
  button:hover{background:#f57c00;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="520"></canvas>
</div>

<div class="hud">
  <div><strong>角度:</strong> <span id="angle">-20°</span></div>
