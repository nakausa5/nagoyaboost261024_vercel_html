</div>
<div class="hint">
  <div>操作: ↑/↓ 角度, ←/→ パワー, Space 発射, R リセット</div>
  <div>ターゲットに当てると得点 +1</div>
</div>

<script>
const canvas = document.getElementById('c');

const W = canvas.width, H = canvas.height;

// ゲーム状態
let angle = -10 * Math.PI/180; // ラジアン（左向きが基準）
let power = 40; // 発射速度スカラー
let arrowsLeft = 5;

const angleText = document.getElementById('angleText');
const powerText = document.getElementById('powerText');
const arrowsLeftText = document.getElementById('arrowsLeft');

function updateUI(){
  angleText.textContent = Math.round(angle * 180/Math.PI) + '°';
  powerText.textContent = Math.round(power);
  arrowsLeftText.textContent = arrowsLeft;
}

// 矢のクラス
class Arrow {
  constructor(x,y,angle,power){
    this.x = x; this.y = y;
    this.vx = Math.cos(angle) * power;
    this.vy = Math.sin(angle) * power;
    this.angle = angle;
    this.active = true;
  }
  update(dt){
    if(!this.active) return;
    // 重力
    this.vy += 9.8 * dt * 2; // 調整
    this.x += this.vx * dt * 60;
    this.y += this.vy * dt * 60;
    this.angle = Math.atan2(this.vy, this.vx);
    // 画面外判定
    if(this.x < -50 || this.x > W+50 || this.y > H+50 || this.y < -50) this.active = false;
  }
  draw(ctx){
    if(!this.active) return;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    // 矢の軸
    ctx.fillStyle = "#6b3";
    ctx.fillRect(-20, -2, 40, 4);
    // 矢じり
    ctx.beginPath();
    ctx.moveTo(20,0);
    ctx.lineTo(28,6);
    ctx.lineTo(28,-6);
    ctx.closePath();
    ctx.fillStyle = "#333";
    ctx.fill();
    // 羽
    ctx.fillStyle = "#ff6b6b";
    ctx.fillRect(-22, -6, 6, 12);
    ctx.restore();
  }
}

// ターゲット
class Target {
  constructor(x,y,r){
    this.x = x; this.y = y; this.r = r;
    this.hit = false;
  }
  draw(ctx){
    ctx.save();
    ctx.translate(this.x, this.y);
    // 外円
    ctx.beginPath();
    ctx.arc(0,0,this.r,0,Math.PI*2);
    ctx.fillStyle = this.hit ? "#999" : "#fff";
    ctx.fill();
    // 中心
    ctx.beginPath();
    ctx.arc(0,0,this.r*0.6,0,Math.PI*2);
    ctx.fillStyle = this.hit ? "#777" : "#ffcc00";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0,0,this.r*0.3,0,Math.PI*2);
    ctx.fillStyle = this.hit ? "#555" : "#ff6b6b";
    ctx.fill();
    ctx.restore();
  }
  checkHit(arrow){
    if(!arrow.active) return false;
    const dx = arrow.x - this.x;
    const dy = arrow.y - this.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d < this.r){
      this.hit = true;
      return true;
    }
    return false;
  }
}
